<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho - Minha Loja Religiosa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .param {
            margin-bottom: 7px;
            line-height: 1.4;
        }
        .param-inline dt {
            display: inline-block;
        }
        .param dt {
            margin: 0;
            margin-right: 7px;
            font-weight: 600;
        }
        .param-inline dd {
            vertical-align: baseline;
            display: inline-block;
        }
        .param dd {
            margin: 0;
            vertical-align: baseline;
        }
        .shopping-cart-wrap .price {
            color: #007bff;
            font-size: 18px;
            font-weight: bold;
            margin-right: 5px;
            display: block;
        }
        var {
            font-style: normal;
        }
        .media img {
            margin-right: 1rem;
        }
        .img-sm {
            width: 90px;
            max-height: 75px;
            object-fit: cover;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand" href="#">Minha Loja Religiosa</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Página Inicial</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Produtos
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" href="livros.html">Livros</a></li>
                        <li><a class="dropdown-item" href="pulseiras.html">Pulseiras</a></li>
                        <li><a class="dropdown-item" href="tercos.html">Terços</a></li>
                    </ul>
                </li>
                <li class="nav-item"><a class="nav-link" href="carrinho.html">Carrinho</a></li>
                <li class="nav-item"><a class="nav-link" href="contato.html">Contato</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1 class="mb-4">Seu Carrinho de Compras</h1>
    <div class="card">
        <table class="table table-hover shopping-cart-wrap">
            <thead class="text-muted">
                <tr>
                    <th scope="col">Produto</th>
                    <th scope="col" width="120">Quantidade</th>
                    <th scope="col" width="120">Preço</th>
                    <th scope="col" width="200" class="text-right">Ação</th>
                </tr>
            </thead>
            <tbody id="produtos">
                <!-- Os produtos serão renderizados aqui -->
            </tbody>
        </table>
    </div>
    <div class="text-end mt-3">
        <p>Total: <span id="total-preco">R$ 0,00</span></p>
        <button type="button" class="btn btn-success">Finalizar Compra</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
    const baseUrl = "http://localhost:3000/posts";

    function atualizarCarrinho() {
        document.getElementById('produtos').innerHTML = "";
        let total = 0;

        for (let item of carrinho) {
            getData(item.id, item.quantidade);
        }

        function getData(id, quantidade) {
            fetch(`${baseUrl}?news=${id}`)
                .then(response => response.json())
                .then(data => {
                    const produto = data[0]; // Assumindo que a resposta é um array com um único objeto
                    const precoUnitario = parseFloat(produto['card-text'].replace("R$ ", "").replace(",", "."));
                    const precoTotal = precoUnitario * quantidade;
                    total += precoTotal;

                    document.getElementById('produtos').innerHTML += `
                        <tr>
                            <td>
                                <figure class="media">
                                    <div class="img-wrap"><img src="${produto.src}" class="img-thumbnail img-sm"></div>
                                    <figcaption class="media-body">
                                        <h6 class="title text-truncate">${produto['card-title']}</h6>
                                    </figcaption>
                                </figure>
                            </td>
                            <td>
                                <input type="number" value="${quantidade}" min="1" class="form-control" onchange="atualizarQuantidade(this, ${produto.news})">
                            </td>
                            <td>
                                <div class="price-wrap">
                                    <var class="price">R$ ${precoTotal.toFixed(2)}</var>
                                </div>
                            </td>
                            <td class="text-right">
                                <a href="#" class="btn btn-outline-danger" onclick="remover(${produto.news})"> × Remove</a>
                            </td>
                        </tr>
                    `;
                    document.getElementById('total-preco').innerText = `R$ ${total.toFixed(2)}`;
                });
        }
    }

    function atualizarQuantidade(el, id) {
        carrinho.map(item => {
            if (item.id == id) {
                item.quantidade = Number(el.value);
            }
        });
        localStorage.setItem('carrinho', JSON.stringify(carrinho));
        atualizarCarrinho();
    }

    function remover(id) {
        const index = carrinho.findIndex(item => item.id == id);
        if (index !== -1) {
            carrinho.splice(index, 1);
        }
        localStorage.setItem('carrinho', JSON.stringify(carrinho));
        atualizarCarrinho();
    }

    atualizarCarrinho();
</script>
</body>
</html>
